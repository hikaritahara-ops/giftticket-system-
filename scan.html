<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ギフチケ記録">
<title>ギフチケ 利用記録</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg:#0b1220; --card:#131c2e; --line:#26324a; --text:#e8edf7; --sub:#93a0b8;
    --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --ng:#ef4444;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
         padding:env(safe-area-inset-top) 16px 40px; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:1.15rem; margin:18px 0 4px; }
  .sub { color:var(--sub); font-size:.8rem; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:.78rem; color:var(--sub); margin:12px 0 6px; }
  label:first-child { margin-top:0; }
  input, select, button { font:inherit; }
  input, select { width:100%; background:#0d1626; color:var(--text); border:1px solid var(--line);
                  border-radius:10px; padding:13px 12px; font-size:1rem; }
  #ticket { font-size:1.5rem; letter-spacing:.08em; text-transform:uppercase; font-family:ui-monospace,Menlo,monospace; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .row .fix { flex:0 0 auto; }
  button { border:0; border-radius:10px; padding:14px 16px; font-weight:700; cursor:pointer; color:#fff; background:var(--accent); font-size:1rem; }
  button.sec { background:#26324a; }
  button.rec { background:var(--ok); width:100%; font-size:1.1rem; padding:16px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .msg { padding:10px 12px; border-radius:10px; font-size:.88rem; margin-top:12px; line-height:1.5; }
  .msg.ok { background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.4); }
  .msg.warn { background:rgba(245,158,11,.14); border:1px solid rgba(245,158,11,.45); }
  .msg.ng { background:rgba(239,68,68,.14); border:1px solid rgba(239,68,68,.45); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .chip { background:#26324a; padding:8px 12px; border-radius:20px; font-family:ui-monospace,Menlo,monospace; cursor:pointer; }
  .list { list-style:none; margin:0; padding:0; }
  .list li { display:flex; align-items:center; justify-content:space-between; gap:8px;
             padding:10px 0; border-bottom:1px solid var(--line); font-size:.9rem; }
  .list li:last-child { border-bottom:0; }
  .mono { font-family:ui-monospace,Menlo,monospace; }
  .del { background:none; color:var(--ng); padding:6px 10px; font-size:.8rem; border:1px solid rgba(239,68,68,.5); }
  .cam-main { width:100%; font-size:1.2rem; padding:20px; background:var(--accent); }
  .tip { color:var(--sub); font-size:.8rem; margin:8px 0 0; }
  .big { font-size:2.2rem; text-align:center; letter-spacing:.12em; margin:16px 0 4px; min-height:2.6rem; }
  details.manual { margin-top:14px; color:var(--sub); font-size:.85rem; }
  details.manual summary { cursor:pointer; padding:6px 0; }
  details.manual input { margin-top:8px; }
  .hidden { display:none !important; }
  /* iPad など、画面が大きい端末では、広く・大きく表示する */
  @media (min-width:700px) {
    body { padding-left:32px; padding-right:32px; }
    .wrap { max-width:760px; }
    h1 { font-size:1.5rem; margin-top:28px; }
    .sub { font-size:.95rem; }
    .card { padding:24px; }
    label { font-size:.95rem; }
    input, select { padding:16px 14px; font-size:1.15rem; }
    #ticket { font-size:1.6rem; }
    .cam-main { font-size:1.5rem; padding:28px; }
    .big { font-size:3rem; }
    button { padding:18px 22px; font-size:1.1rem; }
    button.rec { font-size:1.3rem; padding:22px; }
    .list li { font-size:1.05rem; padding:14px 0; }
    .msg { font-size:1rem; }
  }
  .top { display:flex; justify-content:space-between; align-items:center; }
  .top a, .top button.link { background:none; color:var(--sub); font-size:.8rem; padding:4px 0; font-weight:400; text-decoration:underline; }
  .chk { display:flex; gap:8px; align-items:flex-start; margin-top:10px; font-size:.88rem; }
  .chk input { width:auto; margin-top:3px; }
  .brow { border:1px solid var(--line); border-radius:12px; padding:10px; margin-top:12px; background:#0d1626; }
  .brow img { width:100%; max-height:110px; object-fit:contain; border-radius:8px; background:#000; cursor:zoom-in; }
  .brow img.big { max-height:none; cursor:zoom-out; }
  .brow .st { font-size:.82rem; margin:8px 0 4px; line-height:1.5; }
  .brow .st.ok { color:#86efac; } .brow .st.warn { color:#fcd34d; } .brow .st.ng { color:#fca5a5; }
  .brow input.bt { font-size:1.2rem; font-family:ui-monospace,Menlo,monospace; text-transform:uppercase; letter-spacing:.06em; }
  .brow .chk2 { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:.9rem; color:var(--text); }
  .brow .chk2 input { width:auto; }
  .brow .rm { background:#3a2230; padding:8px 12px; font-size:.8rem; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ログイン -->
  <div id="login" class="hidden">
    <h1>ギフチケ 利用記録</h1>
    <div class="sub">店舗用ログイン</div>
    <div class="card">
      <label>メールアドレス</label>
      <input id="email" type="email" autocomplete="username" inputmode="email">
      <label>パスワード</label>
      <input id="password" type="password" autocomplete="current-password">
      <div id="login-msg"></div>
      <div style="margin-top:14px"><button id="btn-login" style="width:100%">ログイン</button></div>
    </div>
  </div>

  <!-- 記録画面 -->
  <div id="app" class="hidden">
    <div class="top">
      <h1>ギフチケ 利用記録</h1>
      <button class="link" id="btn-logout">ログアウト</button>
    </div>
    <div class="sub">券を使ったら、券番号を入力して「記録する」を押してください。</div>

    <div class="card">
      <label>店舗</label>
      <select id="store"></select>

      <label>利用日</label>
      <input id="used-date" type="date">

      <label>券番号</label>
      <button class="cam-main" id="btn-cam" type="button">📷 券番号を撮影する</button>
      <div class="tip">券の左下の番号を、できるだけ大きく写してください。</div>
      <input id="cam-file" type="file" accept="image/*" capture="environment" class="hidden">
      <button id="btn-pick" type="button" style="margin-top:8px;background:transparent;border:1px solid var(--line, #3a4a5e);color:inherit;padding:10px 14px;border-radius:10px;font-size:15px;width:100%">🖼 保存した写真から選ぶ</button>
      <input id="pick-file" type="file" accept="image/*" class="hidden">
      <div class="big mono" id="big-no">— — — — — — — —</div>
      <div id="n-wrap" class="hidden" style="margin:8px 0">
        <label>マグマルームの時間(Nの券は、60分か90分かを選んでください)</label>
        <select id="n-course" style="width:100%;padding:12px;font-size:16px;border-radius:10px">
          <option value="">選んでください</option>
          <option value="5040">60分(¥5,040)</option>
          <option value="7560">90分(¥7,560)</option>
        </select>
      </div>
      <div id="expect-area"></div>
      <label class="chk" id="staff-wrap"><input type="checkbox" id="staff-disc"><span>スタッフ割(20%引き)の券</span></label>
      <div id="ocr-area"></div>
      <div id="check-area"></div>

      <details class="manual" id="manual">
        <summary>うまく読み取れないとき:番号を手で入力する</summary>
        <input id="ticket" type="text" inputmode="latin" autocomplete="off" autocapitalize="characters" maxlength="12" placeholder="A0042165">
      </details>

      <div id="confirm-box"></div>
      <div style="margin-top:14px">
        <button class="rec" id="btn-record-next" disabled>記録して、次の券を撮る</button>
      </div>
      <div style="margin-top:10px">
        <button class="sec" id="btn-record" style="width:100%" disabled>記録だけする</button>
      </div>
      <div id="fail-area"></div>
    </div>

    <div class="card" id="batch-card">
      <div class="top"><b style="font-size:.95rem">📚 まとめて記録(保存した写真を何枚も選ぶ)</b></div>
      <div class="sub" style="margin-top:6px">写真を一度に選ぶと、番号を順に読み取ります。<b>利用日は、写真を見ながら確認</b>して、記録します。1回に40枚までです。店舗は、上で選んだ店舗です。</div>
      <button class="sec" id="btn-batch" type="button" style="width:100%">📚 写真をまとめて選ぶ</button>
      <input id="batch-files" type="file" accept="image/*" multiple class="hidden">
      <div id="batch-tools" class="hidden" style="margin-top:12px">
        <div class="row">
          <input id="batch-bulk-date" type="date">
          <button class="sec fix" id="btn-bulk-date" type="button">全部の利用日を、この日にする</button>
        </div>
      </div>
      <div id="batch-list"></div>
      <div id="batch-msg"></div>
      <button class="rec" id="btn-batch-save" type="button" style="margin-top:12px" disabled>記録できる券がありません</button>
      <div id="batch-confirm"></div>
    </div>

    <div class="card">
      <div class="top"><b style="font-size:.95rem">この店舗の、日付ごとの合計</b></div>
      <div id="day-totals" style="margin:8px 0 14px"></div>
      <div class="top"><b style="font-size:.95rem">この店舗の最近の記録</b></div>
      <ul class="list" id="recent"></ul>
    </div>
  </div>
</div>

<script>
/* ============ 接続設定(公開してよい鍵です。権限はログインで制御) ============ */
const SUPABASE_URL = 'https://nyziybuxchsicnfkujij.supabase.co';
const SUPABASE_KEY = 'sb_publishable_faUfMhKJTFPTaeFHeE8Z6A_qo23Wutl';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STORES = [
  '三宿店','恵比寿店','名古屋錦店','銀座店','横浜中華街店','PENTHOUSE堀江店','PENTHOUSE代官山店',
  'PENTHOUSE 西麻布','PANTHEON白金台プラチナム','PANTHEON赤坂','PANTHEON西麻布','PANTHEON西梅田',
  'PANTHEON西中洲','PANTHEON新宿','PANTHEON心斎橋','PANTHEON銀座並木通り','PANTHEON京都祇園'
];
const PRICE = { A:15840, B:26400, C:31680, P:90000, N:5040 };
const COURSE = { A:'A(60min)', B:'B(100min)', C:'C(120min)', P:'P(ペントハウス2.5h)', N:'N(マグマルーム)' };
const TICKET_RE = /^[ABCPN][0-9]{7}$/;

const $ = id => document.getElementById(id);
let session = null;
let checked = null;      // 直近の確認結果 { ticket, ok, needConfirm }
let inputMethod = '手入力';

/* ---------- 小さな道具 ---------- */
function todayJST() {
  const j = new Date(Date.now() + 9 * 3600 * 1000);
  return j.toISOString().slice(0, 10);
}
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function el(tag, props, children) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  (children || []).forEach(c => e.append(c));
  return e;
}
function showMsg(target, kind, text) {
  target.replaceChildren(el('div', { className: 'msg ' + kind, textContent: text }));
}
// 全角英数や空白を、半角・大文字にそろえる
function normalizeTicket(s) {
  return (s || '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[\s　\-ー－]/g, '')
    .toUpperCase();
}

/* ---------- ログイン ---------- */
async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_e, s) => { session = s; render(); });
  render();
}
function render() {
  $('login').classList.toggle('hidden', !!session);
  $('app').classList.toggle('hidden', !session);
  if (session) { setupApp(); }
}
$('btn-login').addEventListener('click', async () => {
  const email = $('email').value.trim(), password = $('password').value;
  if (!email || !password) { showMsg($('login-msg'), 'warn', 'メールアドレスとパスワードを入力してください'); return; }
  $('btn-login').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('btn-login').disabled = false;
  if (error) showMsg($('login-msg'), 'ng', 'ログインできませんでした。入力を確認してください。');
});
$('btn-logout').addEventListener('click', async () => { await sb.auth.signOut(); });

/* ---------- 記録画面 ---------- */
let appReady = false;
function setupApp() {
  if (appReady) { loadRecent(); return; }
  appReady = true;
  STORES.forEach(s => $('store').append(el('option', { value: s, textContent: s })));
  const saved = safeGet('scan_store');
  if (saved && STORES.includes(saved)) $('store').value = saved;
  $('used-date').value = todayJST();
  $('used-date').max = todayJST();
  $('store').addEventListener('change', () => { safeSet('scan_store', $('store').value); loadRecent(); updateButton(); });
  $('used-date').addEventListener('change', () => { checked = null; runCheck(); loadDayTotals(); });
  $('ticket').addEventListener('input', () => {
    const v = normalizeTicket($('ticket').value);
    if ($('ticket').value !== v) $('ticket').value = v;
    setTicket(v, '手入力', true);
  });
  loadRecent();
}
function setTicket(v, method, fromInput) {
  if (!fromInput) $('ticket').value = v;
  inputMethod = method;
  checked = null;
  $('check-area').replaceChildren();
  $('big-no').textContent = v || '— — — — — — — —';
  updateButton();
  if (TICKET_RE.test(v)) runCheck();
}
function expectedAmount() {
  const t = normalizeTicket($('ticket').value);
  let face = TICKET_RE.test(t) ? PRICE[t[0]] : null;
  if (t[0] === 'N') face = Number($('n-course').value) || null;   // マグマルームは60分/90分を選ぶ
  if (!face) return null;
  return $('staff-disc').checked ? Math.round(face * 0.8) : face;
}
function updateExpect() {
  const isN = normalizeTicket($('ticket').value)[0] === 'N' && TICKET_RE.test(normalizeTicket($('ticket').value));
  $('n-wrap').classList.toggle('hidden', !isN);
  if (!isN) $('n-course').value = '';
  const amt = expectedAmount();
  const box = $('expect-area');
  if (amt == null) {
    if (isN) box.replaceChildren(el('div', { className: 'msg warn', textContent: 'マグマルームの券です。60分か90分かを選ぶと、想定金額が出ます。' }));
    else box.replaceChildren();
    return;
  }
  const staff = $('staff-disc').checked;
  box.replaceChildren(el('div', { className: 'msg ok', textContent:
    `想定金額 ¥${amt.toLocaleString()}` + (staff ? '(スタッフ割 20%引き)' : '') + '。お会計の金額と合っているか、確認してください。' }));
}
function updateButton() {
  updateExpect();
  const v = $('ticket').value;
  const nOk = v[0] !== 'N' || !!$('n-course').value;
  const ok = !!(nOk && TICKET_RE.test(v) && $('store').value && $('used-date').value && checked && checked.ready);
  $('btn-record').disabled = !ok;
  $('btn-record-next').disabled = !ok;
}

/* 券番号の確認(発券データ・重複) */
async function runCheck() {
  const t = normalizeTicket($('ticket').value);
  const out = $('check-area');
  if (!TICKET_RE.test(t)) { out.replaceChildren(); updateButton(); return; }
  out.replaceChildren(el('div', { className: 'msg', textContent: '確認中...' }));
  const [issuedR, logR, matchR] = await Promise.all([
    sb.from('issued_tickets').select('course,issued_date,destination').eq('ticket_number', t).limit(1),
    sb.from('usage_log').select('store_name,used_date').eq('ticket_number', t).order('used_date', { ascending: false }).limit(3),
    sb.from('matching_results').select('store_name,used_date,used_date_confirmed').eq('ticket_number', t).limit(1)
  ]);
  if ($('ticket').value !== t) return; // 入力が変わっていたら捨てる
  const nodes = [];
  const head = t[0];
  const issued = issuedR.data && issuedR.data[0];
  if (issued) {
    nodes.push(el('div', { className: 'msg ok', textContent:
      `✓ 発券済みの券です:${COURSE[head] || issued.course || head}(額面 ${head === 'N' ? '¥5,040(60分)または ¥7,560(90分)' : '¥' + (PRICE[head] || 0).toLocaleString()})` +
      (issued.destination ? ` / 発券先:${issued.destination}` : '') }));
  } else {
    nodes.push(el('div', { className: 'msg warn', textContent: '⚠ 発券データに見つからない番号です。打ち間違いがないか確認してください。' }));
  }
  const dups = [];
  (logR.data || []).forEach(r => dups.push(`${r.used_date}に${r.store_name}で記録済み`));
  const m = matchR.data && matchR.data[0];
  if (m) dups.push(`写真の読み取り結果に、${m.used_date_confirmed || m.used_date || '日付不明'}・${m.store_name || ''}で登録済み`);
  let needConfirm = !issued;
  if (dups.length) {
    needConfirm = true;
    nodes.push(el('div', { className: 'msg ng', textContent: '⚠ この券は、すでに使われた記録があります:' + dups.join(' / ') }));
  }
  let chk = null;
  if (needConfirm) {
    chk = el('input', { type: 'checkbox', id: 'force' });
    chk.addEventListener('change', () => { checked.ready = chk.checked; updateButton(); });
    nodes.push(el('label', { className: 'chk' }, [chk, el('span', { textContent: '確認しました。それでも記録する' })]));
  }
  out.replaceChildren(...nodes);
  checked = { ticket: t, ready: !needConfirm, issued: !!issued, dup: dups.length > 0 };
  updateButton();
}

/* 記録する(「記録して次の券を撮る」と「記録だけする」で共通) */
const failed = [];   // 保存に失敗した記録(再記録できるように残す)
function buildRow() {
  const t = normalizeTicket($('ticket').value);
  if (!TICKET_RE.test(t) || !checked || !checked.ready) return null;
  const notes = [];
  if (!checked.issued) notes.push('発券データなし');
  if (checked.dup) notes.push('重複の確認済み');
  if (t[0] === 'N') notes.push($('n-course').value === '7560' ? 'マグマルーム90分' : 'マグマルーム60分');
  return {
    ticket_number: t, store_name: $('store').value, used_date: $('used-date').value,
    input_method: inputMethod, note: notes.join(' / ') || null,
    staff_discount: $('staff-disc').checked, expected_amount: expectedAmount(),
    created_by: session && session.user ? session.user.email : null,
    _photo: currentPhoto
  };
}
function resetForNext() {
  currentPhoto = null;
  $('ticket').value = ''; checked = null; inputMethod = '手入力';
  $('staff-disc').checked = false; $('n-course').value = ''; $('confirm-box').replaceChildren();
  $('big-no').textContent = '— — — — — — — —';
  $('ocr-area').replaceChildren();
  $('check-area').replaceChildren();
  updateButton();
}
let currentPhoto = null;   // 直近に撮った(選んだ)写真
// 写真を小さくして(長辺1400px・JPEG)、非公開の保存場所に入れる。成功したら、保存先の名前を返す
async function uploadPhoto(file, usedDate, ticket) {
  let blob = null, ctype = 'image/jpeg', ext = 'jpg', why = '';
  try {
    const canvas = await toCanvas(file, 1400);
    blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
  } catch (e) { why = '画像を小さくできませんでした'; }
  if (!blob) {                                    // 小さくできないときは、元の写真をそのまま保存する
    blob = file; ctype = file.type || 'image/jpeg';
    ext = (ctype.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
  }
  let lastErr = why;
  for (let k = 0; k < 2; k++) {                   // 失敗したら、1回だけやり直す
    const path = `${String(usedDate).slice(0, 7)}/${ticket}_${Date.now()}.${ext}`;
    try {
      const { error } = await sb.storage.from('ticket-photos').upload(path, blob, { contentType: ctype });
      if (!error) return { path, err: '' };
      lastErr = (error.message || String(error)).slice(0, 120);
    } catch (e) { lastErr = String(e && e.message || e).slice(0, 120); }
  }
  return { path: null, err: lastErr || '原因不明' };
}
async function saveRow(row) {
  const { _photo, ...rec0 } = row;
  const rec = Object.assign({}, rec0);
  if (_photo) {
    const up = await uploadPhoto(_photo, rec.used_date, rec.ticket_number);
    if (up.path) rec.photo_path = up.path;
    else {                                          // 写真が保存できなければ、記録しない(写真なしの記録を作らない)
      row._why = '写真の保存に失敗: ' + up.err;

  loadRecent();
  return true;
}

/* ---------- 撮影して読み取る(端末の中だけで処理。写真は外部に送りません) ----------
   1回の読み取りは不安定なので、大きさを変えて何度か読み、
   発券データに存在する番号を優先して決める。 */
let ocrWorker = null;
async function getWorker() {
  if (!ocrWorker) {
    ocrWorker = await Tesseract.createWorker('eng');
    await ocrWorker.setParameters({ tessedit_pageseg_mode: '11' });
  }
  return ocrWorker;
}
$('btn-cam').addEventListener('click', () => $('cam-file').click());
$('btn-pick').addEventListener('click', () => $('pick-file').click());
const onPhoto = async (ev) => {
  const inp = ev.target;
  const f = inp.files[0];
  inp.value = '';
  if (!f) return;
  const area = $('ocr-area');
  currentPhoto = f;
  setTicket('', '手入力');
  showMsg(area, 'ok', '読み取り中...(初回は少し時間がかかります)');
  try {
    const worker = await getWorker();
    const votes = new Map();                       // 番号 → 何回読めたか
    const sizes = [1600, 2400, 800];               // 大きさを変えて読む
    let valid = [];                                // 発券データにある番号
    for (let k = 0; k < sizes.length; k++) {
      showMsg(area, 'ok', `読み取り中...(${k + 1}/${sizes.length})`);
      const canvas = await toCanvas(f, sizes[k]);
      const { data } = await worker.recognize(canvas);
      extractCandidates(data.text || '').forEach(c => votes.set(c, (votes.get(c) || 0) + 1));
      if (votes.size) {
        valid = await filterIssued([...votes.keys()]);
        // 発券データにある番号が、1つだけ見つかって、2回以上読めていれば、そこで終了
        if (valid.length === 1 && votes.get(valid[0]) >= 2) break;
      }
    }
    // 券全体を遠くから撮ったときなど、番号が小さくて読めない場合:写真を小さく区切って、1か所ずつ大きくして読む
    if (valid.length === 0) {
      const tv = await tilePass(f, worker, area);
      tv.forEach(c => { votes.set(c, (votes.get(c) || 0) + 1); if (!valid.includes(c)) valid.push(c); });
    }
    const all = [...votes.keys()];
    if (!all.length) {
      showMsg(area, 'warn', '番号が読み取れませんでした。券番号の部分を、少し大きく、まっすぐ写して、もう一度撮ってください。(それでも読めないときは、下の「手で入力する」を使えます)');
      return;
    }
    // 候補を並べる:発券データにある番号 → 読めた回数の多い順
    const ranked = all.sort((a, b) => (valid.includes(b) - valid.includes(a)) || (votes.get(b) - votes.get(a)));
    if (valid.length === 1) {
      setTicket(valid[0], '撮影読取');
      showMsg(area, 'ok', '読み取りました。大きく表示された番号を、券の番号と見比べてください。違うときは、もう一度撮影してください。');
      return;
    }
    if (valid.length === 0 && ranked.length === 1) {
      setTicket(ranked[0], '撮影読取');
      showMsg(area, 'warn', '読み取りました(発券データには、見つかっていません)。券の番号と、よく見比べてください。');
      return;
    }
    const box = el('div', {}, [el('div', { className: 'msg warn', textContent: '番号の候補が複数あります。券の番号と合っているものを、タップしてください。(✓は、発券データにある番号です)' })]);
    const chips = el('div', { className: 'chips' });
    ranked.slice(0, 5).forEach(c => {
      const chip = el('span', { className: 'chip', textContent: (valid.includes(c) ? '✓ ' : '') + c });
      chip.addEventListener('click', () => { area.replaceChildren(); setTicket(c, '撮影読取'); });
      chips.append(chip);
    });
    box.append(chips);
    area.replaceChildren(box);
  } catch (e) {
    showMsg(area, 'ng', '読み取りに失敗しました。通信を確認して、もう一度撮影するか、下の「手で入力する」を使ってください。');
  }
};
$('cam-file').addEventListener('change', onPhoto);
$('pick-file').addEventListener('change', onPhoto);
// 写真を区切って(横40%×縦30%、半分ずつずらす)大きくして読む。真ん中から順に読み、発券データにある番号が見つかった時点で終了
async function tilePass(file, worker, area) {
  const big = await toCanvas(file, 3000);
  const W = big.width, H = big.height, tw = 0.4, th = 0.3;
  const tiles = [];
  for (let x = 0; x + tw <= 1.0001; x += tw / 2) for (let y = 0; y + th <= 1.0001; y += th / 2) tiles.push([x, y]);
  tiles.sort((a, b) => (Math.abs(a[0] + tw / 2 - 0.5) + Math.abs(a[1] + th / 2 - 0.5)) - (Math.abs(b[0] + tw / 2 - 0.5) + Math.abs(b[1] + th / 2 - 0.5)));
  await worker.setParameters({ tessedit_pageseg_mode: '6' });
  try {
    for (let i = 0; i < tiles.length; i++) {
      showMsg(area, 'ok', `番号の場所を探しています...(${i + 1}/${tiles.length})`);
      const [x, y] = tiles[i];
      const sw = Math.round(W * tw), sh = Math.round(H * th);
      const c = document.createElement('canvas');
      c.width = 1200; c.height = Math.round(sh * 1200 / sw);
      c.getContext('2d').drawImage(big, Math.round(W * x), Math.round(H * y), sw, sh, 0, 0, c.width, c.height);
      const { data } = await worker.recognize(c);
      const t = (data.text || '').toUpperCase();
      const nums = new Set();
      let m; const re = /(?<![0-9])([0-9OIlSB]{7})(?![0-9])/g;   // 頭の英字が読めなくても、数字7桁を拾う
      while ((m = re.exec(t)) !== null) {
        const d = m[1].replace(/O/g, '0').replace(/[Il]/g, '1').replace(/S/g, '5').replace(/B/g, '8');
        if (/^[0-9]{7}$/.test(d)) nums.add(d);
      }
      const variants = [];
      nums.forEach(d => ['A', 'B', 'C', 'P', 'N'].forEach(l => variants.push(l + d)));
      if (variants.length) {
        const ok = await filterIssued(variants);     // 発券データにある番号だけ採用
        if (ok.length) return ok;
      }
    }
  } finally {
    await worker.setParameters({ tessedit_pageseg_mode: '11' });
  }
  return [];
}
// 候補のうち、発券データに存在するものだけを返す
async function filterIssued(cands) {
  try {
    const { data } = await sb.from('issued_tickets').select('ticket_number').in('ticket_number', cands);
    return (data || []).map(r => r.ticket_number);
  } catch (e) { return []; }
}
function toCanvas(file, maxSide) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const g = c.getContext('2d');
      g.drawImage(img, 0, 0, c.width, c.height);   // 白黒化などの加工はしない(かえって読めなくなるため)
      URL.revokeObjectURL(url); resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src = url;
  });
}
// 読み取った文字から、「英字1文字(A/B/C/P)+ 数字7桁」の形を探す
function extractCandidates(text) {
  const out = new Set();
  const t = (text || '').toUpperCase();
  const re = /([ABCPN])[\s\-]?([0-9OIlSB]{7})/g;
  let m;
  while ((m = re.exec(t)) !== null) {
    const after = t.charAt(re.lastIndex);
    if (/[0-9]/.test(after)) continue;               // 8桁以上の数字の一部は除く
    const digits = m[2].replace(/O/g, '0').replace(/[Il]/g, '1').replace(/S/g, '5').replace(/B/g, '8');
    if (/^[0-9]{7}$/.test(digits)) out.add(m[1] + digits);
  }
  return [...out];
}

/* ---------- まとめて記録(写真を何枚も選んで、1枚ずつ確認して、まとめて記録) ----------
   利用日は手書きで読みにくいので、人が写真を見て確認する。最初の日付は、写真の日付を仮に入れる。 */
const batch = [];          // 1枚ごとの状態
let batchBusy = false;
function jstDateOf(ms) { return new Date(ms + 9 * 3600 * 1000).toISOString().slice(0, 10); }
function amountFor(t, ncourse, staff) {
  if (!TICKET_RE.test(t)) return null;
  const f = t[0] === 'N' ? (Number(ncourse) || null) : PRICE[t[0]];
  if (!f) return null;
  return staff ? Math.round(f * 0.8) : f;
}
async function ocrOne(file, area) {
  const worker = await getWorker();
  const votes = new Map(); let valid = [];
  for (const size of [1600, 2400, 800]) {
    const canvas = await toCanvas(file, size);
    const { data } = await worker.recognize(canvas);
    extractCandidates(data.text || '').forEach(c => votes.set(c, (votes.get(c) || 0) + 1));
    if (votes.size) {
      valid = await filterIssued([...votes.keys()]);
      if (valid.length === 1 && votes.get(valid[0]) >= 2) break;
    }
  }
  if (!valid.length) {
    const tv = await tilePass(file, worker, area);
    tv.forEach(c => { votes.set(c, (votes.get(c) || 0) + 1); if (!valid.includes(c)) valid.push(c); });
  }
  const all = [...votes.keys()];
  if (!all.length) return '';
  all.sort((a, b) => (valid.includes(b) - valid.includes(a)) || (votes.get(b) - votes.get(a)));
  return all[0];
}
async function checkTicketBatch(r) {      // 発券データにあるか・すでに記録されていないか
  const t = r.ticket;
  r.issued = null; r.prior = null;
  if (!TICKET_RE.test(t)) { refreshRow(r); return; }
  const [iss, log] = await Promise.all([
    sb.from('issued_tickets').select('ticket_number').eq('ticket_number', t).limit(1),
    sb.from('usage_log').select('store_name,used_date').eq('ticket_number', t).order('used_date', { ascending: false }).limit(1)
  ]);
  if (r.ticket !== t) return;
  r.issued = !!(iss.data && iss.data.length);
  r.prior = (log.data && log.data[0]) ? `${log.data[0].used_date} に ${log.data[0].store_name} で記録済み` : null;
  refreshAll();
}
function rowReady(r) {
  return TICKET_RE.test(r.ticket) && !!r.date && r.dateOk && !r.prior && !r.dupInList &&
    (r.ticket[0] !== 'N' || !!r.ncourse) && !!$('store').value && !r.busy;
}
function refreshRow(r) {
  const e = r.e;
  const isN = r.ticket[0] === 'N' && TICKET_RE.test(r.ticket);
  e.nwrap.classList.toggle('hidden', !isN);
  let kind = 'ok', text = '';
  if (r.busy) { kind = 'warn'; text = r.progress || '読み取り中...'; }
  else if (r.upErr) { kind = 'ng'; text = '写真の保存に失敗しました(' + r.upErr + ')。もう一度、「記録する」を押してください。'; }
  else if (!TICKET_RE.test(r.ticket)) { kind = 'ng'; text = '番号が読み取れていません。写真を見て、番号を入力してください。'; }
  else if (r.prior) { kind = 'ng'; text = '⚠ ' + r.prior + '(重複のため、記録できません)'; }
  else if (r.dupInList) { kind = 'ng'; text = '⚠ 同じ番号が、この一覧に2枚あります(重複のため、記録できません)'; }
  else if (isN && !r.ncourse) { kind = 'warn'; text = 'マグマルームです。60分か90分かを選んでください。'; }
  else if (!r.date) { kind = 'warn'; text = '利用日を入れてください。'; }
  else if (!r.dateOk) { kind = 'warn'; text = '利用日を、写真と見比べて、「日付OK」にチェックしてください。(最初の日付は、写真の日付を仮に入れています)'; }
  else {
    const amt = amountFor(r.ticket, r.ncourse, r.staff);
    kind = r.issued === false ? 'warn' : 'ok';
    text = (r.issued === false ? '⚠ 発券データに無い番号です(N券は、現在データがありません)。 ' : '✓ ') + (amt != null ? `想定金額 ¥${amt.toLocaleString()}` + (r.staff ? '(スタッフ割)' : '') : '');
  }
  e.st.className = 'st ' + kind; e.st.textContent = text;
}
function refreshAll() {
  const seen = new Map();
  batch.forEach(r => { if (TICKET_RE.test(r.ticket)) seen.set(r.ticket, (seen.get(r.ticket) || 0) + 1); });
  const used = new Set();
  batch.forEach(r => {
    r.dupInList = TICKET_RE.test(r.ticket) && seen.get(r.ticket) > 1 && used.has(r.ticket);
    if (TICKET_RE.test(r.ticket)) used.add(r.ticket);
  });
  batch.forEach(refreshRow);
  const n = batch.filter(rowReady).length;
  const b = $('btn-batch-save');
  b.disabled = n === 0;
  b.textContent = n ? `確認できた ${n} 枚を、記録する` : '記録できる券がありません';
  $('batch-tools').classList.toggle('hidden', batch.length === 0);
}
function makeRow(file) {
  const r = { id: Math.random().toString(36).slice(2), file, url: URL.createObjectURL(file), ticket: '', method: '撮影読取',
             date: jstDateOf(file.lastModified || Date.now()), dateOk: false, staff: false, ncourse: '', busy: true, progress: '順番を待っています...',

  r.e = { st, tin, nwrap, nsel, din, dok, staff };
  r.box = el('div', { className: 'brow' }, [
    img, st,

    el('label', { className: 'chk2' }, [dok, el('span', { textContent: '日付OK(写真と見比べました)' })]),
    el('label', { className: 'chk2' }, [staff, el('span', { textContent: 'スタッフ割(20%引き)の券' })]),
    rm

}
async function runBatchOcr() {
  if (batchBusy) return;
  batchBusy = true;
  try {
    for (;;) {
      const r = batch.find(x => x.busy && !x.started);
      if (!r) break;
      r.started = true; r.progress = '読み取り中...';
      refreshRow(r);
      const dummy = el('div');
      try {
        r.ticket = await ocrOne(r.file, dummy);
      } catch (e) { r.ticket = ''; }
      r.busy = false;
      r.e.tin.value = r.ticket;
      if (TICKET_RE.test(r.ticket)) await checkTicketBatch(r);
      refreshAll();
    }
  } finally { batchBusy = false; }
}
$('btn-batch').addEventListener('click', () => $('batch-files').click());
$('batch-files').addEventListener('change', (ev) => {
  const files = [...ev.target.files]; ev.target.value = '';
  if (!files.length) return;
  const room = 40 - batch.length;
  const take = files.slice(0, Math.max(0, room));
  if (files.length > take.length) showMsg($('batch-msg'), 'warn', `1回に40枚までです。${take.length}枚だけ追加しました。残りは、記録したあとに、もう一度選んでください。`);
  else $('batch-msg').replaceChildren();
  take.forEach(f => { const r = makeRow(f); batch.push(r); $('batch-list').append(r.box); });
  refreshAll();
  runBatchOcr();
});
$('btn-bulk-date').addEventListener('click', () => {
  const d = $('batch-bulk-date').value;
  if (!d) { showMsg($('batch-msg'), 'warn', '日付を選んでから、押してください。'); return; }
  batch.forEach(r => { r.date = d; r.dateOk = true; r.e.din.value = d; r.e.dok.checked = true; });
  $('batch-msg').replaceChildren();
  refreshAll();
});
$('btn-batch-save').addEventListener('click', () => {
  const rows = batch.filter(rowReady);
  if (!rows.length) return;
  const total = rows.reduce((s, r) => s + (amountFor(r.ticket, r.ncourse, r.staff) || 0), 0);
  const yes = el('button', { className: 'rec', textContent: `はい、${rows.length}枚を記録する`, style: 'margin-top:10px' });
  const no = el('button', { className: 'sec', textContent: 'やめる(直す)', style: 'width:100%;margin-top:8px' });
  no.addEventListener('click', () => $('batch-confirm').replaceChildren());
  yes.addEventListener('click', async () => {
    yes.disabled = true; no.disabled = true;
    const payload = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      $('batch-confirm').replaceChildren(el('div', { className: 'msg warn', textContent: `写真を保存しながら、記録しています...(${i + 1}/${rows.length})` }));
      const up = await uploadPhoto(r.file, r.date, r.ticket);
      if (!up.path) { r.upErr = up.err; continue; }     // 写真が保存できない券は、記録しない
      r.upErr = '';
      const photoPath = up.path;
      const notes = [];
      if (r.issued === false) notes.push('発券データなし');
      if (r.ticket[0] === 'N') notes.push(r.ncourse === '7560' ? 'マグマルーム90分' : 'マグマルーム60分');
      notes.push('まとめて記録');
      payload.push({ photo_path: photoPath, ticket_number: r.ticket, store_name: $('store').value, used_date: r.date, input_method: r.method, note: notes.join(' / '),
               staff_discount: r.staff, expected_amount: amountFor(r.ticket, r.ncourse, r.staff),
               created_by: session && session.user ? session.user.email : null });
    }
    const okRows = rows.filter(r => !r.upErr);
    if (!payload.length) {
      refreshAll();
      $('batch-confirm').replaceChildren(el('div', { className: 'msg ng', textContent: '写真を保存できなかったため、1枚も記録していません。各行に、理由が出ています。もう一度、「記録する」を押してください。' }));
      return;
    }
    const { error } = await sb.from('usage_log').insert(payload);
    if (error) {
      $('batch-confirm').replaceChildren(el('div', { className: 'msg ng', textContent: '記録できませんでした。通信を確認して、もう一度押してください。(一覧は残してあります)' }));
      return;
    }
    okRows.forEach(r => { const k = batch.indexOf(r); if (k >= 0) batch.splice(k, 1); URL.revokeObjectURL(r.url); r.box.remove(); });
    const ng = rows.length - okRows.length;
    $('batch-confirm').replaceChildren(ng
      ? el('div', { className: 'msg ng', textContent: `✓ ${okRows.length}枚を記録しました。ただし、${ng}枚は、写真を保存できなかったため、記録していません。一覧に残っています(理由は各行に出ています)。もう一度、「記録する」を押してください。` })
      : el('div', { className: 'msg ok', textContent: `✓ ${okRows.length}枚を記録しました。` }));
    refreshAll(); loadRecent();
  });
  $('batch-confirm').replaceChildren(
    el('div', { className: 'msg warn', textContent: `本当に記録しますか?  ${$('store').value} / ${rows.length}枚 / 想定金額の合計 ¥${total.toLocaleString()}` }),
    yes, no);
});

init();
</script>
</body>
